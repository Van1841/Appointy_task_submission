<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create SynapseMind Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .icon-container {
      display: flex;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    canvas {
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    h1 {
      color: #333;
    }
    .instructions {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .instructions ol {
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>🧠 SynapseMind Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click the buttons below to download each icon size</li>
      <li>Save them in the <code>synapsemind-extension</code> folder</li>
      <li>Name them exactly: <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code></li>
      <li>Load the extension in Chrome</li>
    </ol>
  </div>

  <div class="icon-container">
    <div>
      <canvas id="icon16" width="16" height="16"></canvas>
      <br>
      <button onclick="downloadIcon('icon16', 16)">Download icon16.png</button>
    </div>
    <div>
      <canvas id="icon48" width="48" height="48"></canvas>
      <br>
      <button onclick="downloadIcon('icon48', 48)">Download icon48.png</button>
    </div>
    <div>
      <canvas id="icon128" width="128" height="128"></canvas>
      <br>
      <button onclick="downloadIcon('icon128', 128)">Download icon128.png</button>
    </div>
  </div>

  <script>
    // Draw icons on canvases
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Create gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      // Fill background
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Draw brain emoji or SM text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.5}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (size >= 48) {
        ctx.fillText('🧠', size / 2, size / 2);
      } else {
        ctx.font = `bold ${size * 0.6}px Arial`;
        ctx.fillText('SM', size / 2, size / 2);
      }
    }

    // Download icon
    function downloadIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Draw all icons on page load
    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
